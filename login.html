```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S2Y | Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0d2c3d;
            font-family: Arial, sans-serif;
            color: white;
        }

        .login-box {
            width: 350px;
            padding: 35px;
            background: #142f3e;
            border: 1px solid #4eb347;
            border-radius: 12px;
            text-align: center;
        }

        h1 {
            color: #4eb347;
            margin-bottom: 5px;
        }

        p {
            color: #b8c7ce;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background: #0d2c3d;
            color: white;
            border: 1px solid #526a77;
            border-radius: 5px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            background: #4eb347;
            color: #0d2c3d;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #65ca5d;
        }

        a {
            color: #4eb347;
            text-decoration: none;
        }
    </style>
</head>

<body>
    <div class="login-box">
        <h1>S2Y</h1>
        <p>From Shishya to Yoddha</p>

        <h2>Welcome Back</h2>

        <form id="loginForm">
            <input type="email" placeholder="Email Address"
                   autocomplete="email" required>

            <input type="password" placeholder="Password"
                   autocomplete="current-password" required>

            <button type="submit">LOGIN</button>
        </form>

        <p>New cadet? <a href="register.html">Create Account</a></p>

        <p><a href="index.html">← Back to Home</a></p>
    </div>

    <script>
        document.getElementById("loginForm").addEventListener(
            "submit", function(event) {
                event.preventDefault();
                alert("Login interface ready! Backend integration is next.");
            }
        );
    </script>
</body>
</html>
